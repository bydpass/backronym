# 站点内容规则，HTTP 与 HTTPS 共用。
# 服务器上的位置：/etc/nginx/snippets/bydpass-site.conf。
# 缓存策略 $bydpass_cache 在 nginx.conf 顶部的 map 里按扩展名定。

root /srv/bydpass/root;
index index.html;
charset utf-8;
server_tokens off;

# 用来接 acme.sh 的 HTTP 验证文件。
location ^~ /.well-known/acme-challenge/ {
    root /srv/bydpass/acme;
    default_type text/plain;
}

# 脚本、页面、样式压缩；字体（woff2）本身已压缩，不再压。
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

add_header Cache-Control $bydpass_cache always;
add_header X-Content-Type-Options "nosniff" always;

location = /backronym {
    return 301 /backronym/;
}

# 门户和两种布局里的构建标记一律不对外。
location ~ ^/backronym/(?:\.?backronym-(?:web|site)-build|app/\.?backronym-web-build)$ {
    return 404;
}

location /backronym/ {
    alias /srv/bydpass/backronym/current/;
    try_files $uri $uri/ =404;
}

location / {
    try_files $uri $uri/ =404;
}
