# 国内版站点（bydpass.cn）的 Nginx 配置。
# 服务器上的位置：/etc/nginx/sites-available/bydpass，软链到 sites-enabled/。
# 改完在本机跑 site/deploy/cn/deploy.sh --nginx 上传并重载（先 nginx -t 检查）。
#
# 目录：
#   /srv/bydpass/root/                     站点根目录的占位页（备案号挂在这里）
#   /srv/bydpass/backronym/releases/<名>/  每次发布一个目录
#   /srv/bydpass/backronym/current         软链，指向当前发布；回滚就改它
#
# 证书：备案通过、域名解析到本机以后才签（acme.sh + Let's Encrypt，HTTP 验证）。
# 签好之前只开 80；签好之后把下面「HTTPS 之后」两段的注释去掉，80 改成跳转。

# 文件名不带指纹：页面、脚本、样式每次向服务器确认，没改就回 304；
# 字体长期缓存（30 天），改字体时换文件名。
map $uri $bydpass_cache {
    ~*\.woff2$  "public, max-age=2592000";
    default     "no-cache";
}

# 拿 IP 或别的域名来访问：直接断开，不回任何内容。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name bydpass.cn www.bydpass.cn;

    # 备案期间整站不对外：备案通过、域名解析到本机后删掉下面这一行，再跑 deploy.sh --nginx。
    return 444;

    # HTTPS 之后：下面这行取消注释，再把 include 那行删掉。
    # return 301 https://bydpass.cn$request_uri;

    include /etc/nginx/snippets/bydpass-site.conf;
}

