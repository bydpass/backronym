# 国际版门户和网页版部署到 GitHub Pages：公开仓库的 main 一更新就重建、重发。
# 国内版同样用 pack:site 的 dist/site/，门户在根，网页版在 app/。
# 只在公开仓库 bydpass/backronym 上跑：私有的完整历史仓库也带着这个文件，那边不部署。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只部署一次；正在部署的不取消，免得线上停在半新半旧
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bydpass/backronym'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # 字体子集已入库，发布不安装依赖、不取外站资源。
      - run: |
          npm run pack:site
          rm dist/site/.backronym-site-build dist/site/app/.backronym-web-build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
